<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USD / CNY Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root { --bg:#f7f5f2; --card:#fff; --text:#222; --muted:#777; --accent:#8b5e3c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1b1a19; --card:#262422; --text:#eee; --muted:#aaa; --accent:#d9a77a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--text); padding:16px; }
  main { max-width:900px; margin:0 auto; }
  h1 { margin:8px 0 4px; }
  p.sub { color:var(--muted); margin:0 0 20px; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .card { background:var(--card); border-radius:12px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .card .label { color:var(--muted); font-size:13px; }
  .card .value { font-size:24px; font-weight:600; color:var(--accent); margin-top:4px; }
  .chart-box { background:var(--card); border-radius:12px; padding:14px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  footer { color:var(--muted); font-size:12px; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>US Dollar vs Chinese Yuan</h1>
  <p class="sub">Live exchange-rate data for the past 12 months, fetched from the European Central Bank via the Frankfurter API.</p>

  <div class="cards">
    <div class="card"><div class="label">Latest USD → CNY</div><div class="value" id="latest">…</div></div>
    <div class="card"><div class="label">12-month high</div><div class="value" id="high">…</div></div>
    <div class="card"><div class="label">12-month low</div><div class="value" id="low">…</div></div>
    <div class="card"><div class="label">Change over 12 months</div><div class="value" id="change">…</div></div>
  </div>

  <div class="chart-box"><canvas id="chart" height="140"></canvas></div>

  <footer id="footer">Loading data…</footer>
</main>

<script>
  const start = new Date();
  start.setFullYear(start.getFullYear() - 1);
  const startStr = start.toISOString().slice(0, 10);
  const urls = [
    `https://api.frankfurter.dev/v1/${startStr}..?from=USD&to=CNY`,
    `https://api.frankfurter.app/${startStr}..?from=USD&to=CNY`
  ];

  async function getData() {
    for (const url of urls) {
      try {
        const res = await fetch(url);
        if (res.ok) return await res.json();
      } catch (e) { /* try next */ }
    }
    throw new Error("Could not reach the exchange-rate API.");
  }

  getData().then(data => {
    const dates = Object.keys(data.rates).sort();
    const values = dates.map(d => data.rates[d].CNY);
    const first = values[0], last = values[values.length - 1];
    const pct = ((last - first) / first * 100).toFixed(2);

    document.getElementById("latest").textContent = last.toFixed(4);
    document.getElementById("high").textContent = Math.max(...values).toFixed(4);
    document.getElementById("low").textContent = Math.min(...values).toFixed(4);
    document.getElementById("change").textContent = (pct > 0 ? "+" : "") + pct + "%";
    document.getElementById("footer").textContent =
      `Data from ${dates[0]} to ${dates[dates.length - 1]} · Source: Frankfurter API (ECB reference rates)`;

    new Chart(document.getElementById("chart"), {
      type: "line",
      data: { labels: dates, datasets: [{
        label: "USD → CNY", data: values, borderColor: "#b07a4f",
        backgroundColor: "rgba(176,122,79,.12)", fill: true, pointRadius: 0, tension: .2 }] },
      options: { plugins: { legend: { display: false } },
                 scales: { x: { ticks: { maxTicksLimit: 8 } } } }
    });
  }).catch(err => {
    document.getElementById("footer").textContent = "Error: " + err.message;
  });
</script>
</body>
</html>
